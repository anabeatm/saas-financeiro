spring.application.name=finEXP
# arquivo de secrets local, opcional (sobrescreve o que tá aqui embaixo)
spring.config.import=optional:classpath:application-secrets.properties
spring.messages.basename=messages

# porta (quem define é o render)
server.port=${PORT:8080}
# usa os headers X-Forwarded-* do proxy
server.forward-headers-strategy=native

# variáveis de ambiente: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, JWT_EXPIRATION (ms)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finexp?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# mysql local, postgres em produção. pool pequeno por causa do plano free
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# Criação da Tabela
spring.jpa.hibernate.ddl-auto=update

# email: smtp local, brevo em produção (BREVO_API_KEY + MAIL_FROM)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# timeout do smtp: 10s
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:${spring.mail.username}}
app.mail.from-name=FinEXP

# ia (gemini). sem GEMINI_API_KEY os endpoints de ia dão 503
app.ai.gemini-api-key=${GEMINI_API_KEY:}
app.ai.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# fuso dos usuários (dia do streak e fim do mês)
app.gamification.zone=${GAMIFICATION_ZONE:America/Sao_Paulo}

# actuator: só o health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# health não depende do smtp
management.health.mail.enabled=false
