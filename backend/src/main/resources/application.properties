spring.application.name=finEXP
# Optional so the app can run with environment variables only (e.g. in a deploy).
# Values in this file override the ones below.
spring.config.import=optional:classpath:application-secrets.properties
spring.messages.basename=messages

# Hosting platforms (Render) tell the app which port to listen on
server.port=${PORT:8080}

# Environment variables: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, JWT_EXPIRATION (ms)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finexp?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# The JDBC driver (MySQL locally, PostgreSQL in production) is picked from the URL.
# Small pool: the free PostgreSQL plan allows only a few connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# Criação da Tabela
spring.jpa.hibernate.ddl-auto=update

# E-mail. Local development: SMTP (Gmail) with MAIL_USERNAME / spring.mail.password.
# Production: set BREVO_API_KEY and MAIL_FROM to send through Brevo's HTTPS API
# (Render's free plan blocks the SMTP ports).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Give up after 10 s instead of waiting forever when SMTP is unreachable (e.g. blocked by the host)
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:${spring.mail.username}}
app.mail.from-name=FinEXP

# Actuator: only the health endpoint is exposed, without details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Health must not depend on the SMTP server (blocked in production, where Brevo is used)
management.health.mail.enabled=false
